<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday!</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lavishly+Yours&family=PT+Serif:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/hbd.css" type="text/css"/>
    <link href="css/bootstrap.min.css" rel="stylesheet" type="text/css"/>
</head>
<body>
    <main id="hbd">
        <div class="con">
            <div class="pic1 protected-img"></div>
            <div class="pic2 protected-img"></div>
            <div class="pic3 protected-img"></div>
            <h1 class="bday">Happy Birthday</h1>
            <p class="bella">BELLA</p>
            <div id="clickme" class="button">CLICK ME!</div>
            <!-- <button id="resetBtn">Reset</button> -->
        </div>
        <div id="voucher" class="coupon">
            <img id="closeBtn" src="images/x.png">
            <img class="cpn" src="images/voucher.png">
        </div>
    </main>
    <div id="pop" class="confidential">
        <div class="box">
            <div class="field">
                <label>Type the password</label>
                <input type="password" id="password">
                <div id="error" style="display: none;">Incorrect password.</div>
            </div>
             <button id="submitBtn">Submit</button>
        </div>
    </div>
</body>
<script src="js/jquery.min.js"></script>
